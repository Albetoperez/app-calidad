<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SIGMA QC - Control de Calidad</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/localforage/1.10.0/localforage.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <link rel="stylesheet" href="qc-style.css">
</head>
<body>
    <header>
        <div class="logo-area" onclick="irInicio()" style="cursor: pointer;" title="Volver al menú principal">
            <img src="logo.jpg" alt="Elecnor Logo" style="max-height: 40px;">
            <span class="brand">ELECNOR</span>
            <span class="app-name">QC CONTROL</span>
        </div>
        
        <div class="nav-container" id="header-nav" style="display: none;">
            <button class="btn-nav-outline" onclick="irInicio()">⬅ MENÚ PRINCIPAL</button>
            <button class="btn-nav-white" onclick="document.getElementById('excel-file').click()">📂 CARGAR LISTADOS</button>
            <button class="btn-nav-outline" onclick="window.location.href='qc-dashboard.html'">📊 DASHBOARD QC</button>
        </div>

        <input type="file" id="excel-file" accept=".xlsx, .xls, .csv" multiple style="display:none;" onchange="importarArchivos(this)">
    </header>

    <div id="portada" class="portada-container">
        <div class="portada-logo-wrapper">
            <img src="logo.jpg" alt="Logo Elecnor" style="width: 250px; max-width: 80vw; margin-bottom: 20px;">
            <h2 class="portada-title">SIGMA QUALITY CONTROL</h2>
            <div style="color: #888; font-size: 0.78rem; font-weight: 700; margin-top: 10px; border-top: 1px solid #eee; padding-top: 12px; text-transform: uppercase; letter-spacing: 1px;">Delegación Renovables, Gas y Agua</div>
        </div>
        <div class="portada-botones">
            <button class="btn-portada" onclick="abrirMapa()">
                <span style="font-size:2rem;">🗺️</span>
                <div>
                    <strong style="display:block; font-size:1.1rem; margin-bottom: 3px;">Mapa de Calidad</strong>
                    <small style="font-weight:400; opacity:0.85; font-size:0.8rem;">Auditoría visual de hincas</small>
                </div>
            </button>
            <button class="btn-portada" onclick="window.location.href='qc-dashboard.html'">
                <span style="font-size:2rem;">📊</span>
                <div>
                    <strong style="display:block; font-size:1.1rem; margin-bottom: 3px;">Dashboard QC</strong>
                    <small style="font-weight:400; opacity:0.85; font-size:0.8rem;">KPIs, Pareto y Listados</small>
                </div>
            </button>
        </div>
    </div>

    <div id="app-mapa" style="display: none;">
        <nav class="toolbar">
            <div class="tool active" data-task="C" onclick="setTask('C', this)" style="--c: #ff9800">Corte/Mec.</div>
            <div class="tool" data-task="P" onclick="setTask('P', this)" style="--c: #e91e63">POT</div>
            <div class="tool" data-task="RC" onclick="setTask('RC', this)" style="--c: #9c27b0">Revire Cab.</div>
            <div class="tool" data-task="RB" onclick="setTask('RB', this)" style="--c: #3f51b5">Revire Base</div>
            <div class="tool" data-task="CI" onclick="setTask('CI', this)" style="--c: #795548">Cimentación</div>
            <div class="tool" data-task="E" onclick="setTask('E', this)" style="--c: #f44336">Extracción</div>
            <div class="tool" data-task="NA" onclick="setTask('NA', this)" style="--c: #fff; border: 1px solid #ccc;">🟢 OK (Borrar)</div>
        </nav>

        <div class="filter-bar">
            <select id="select-arco" onchange="actualizarBloques()" style="font-weight: bold;"></select>
            <select id="select-block" onchange="renderMatrix()"></select>
        </div>

        <main id="matrix-container">
            <div class="empty-state">Pulsa "Cargar Listados" en la cabecera para empezar.</div>
        </main>

        <div id="summary-panel" class="summary-panel hidden">
            <h3>Defectos Bloque: <span id="summary-block-name">-</span></h3>
            <div class="summary-grid">
                <div class="sum-item" style="border-left-color: #ff9800"><span>Corte/Mec.</span><strong id="sum-C">0</strong></div>
                <div class="sum-item" style="border-left-color: #e91e63"><span>POT</span><strong id="sum-P">0</strong></div>
                <div class="sum-item" style="border-left-color: #9c27b0"><span>Rev. Cabeza</span><strong id="sum-RC">0</strong></div>
                <div class="sum-item" style="border-left-color: #3f51b5"><span>Rev. Base</span><strong id="sum-RB">0</strong></div>
                <div class="sum-item" style="border-left-color: #795548"><span>Cimentación</span><strong id="sum-CI">0</strong></div>
                <div class="sum-item" style="border-left-color: #f44336"><span>Extracción</span><strong id="sum-E">0</strong></div>
            </div>
        </div>
    </div>

    <script src="qc-app.js"></script>
    <script>
        function abrirMapa() {
            document.getElementById('portada').style.display = 'none';
            document.getElementById('app-mapa').style.display = 'block';
            document.getElementById('header-nav').style.display = 'flex';
        }
        
        function irInicio() {
            // Limpiamos la url por si tenía el #mapa
            history.pushState("", document.title, window.location.pathname + window.location.search);
            document.getElementById('app-mapa').style.display = 'none';
            document.getElementById('header-nav').style.display = 'none';
            document.getElementById('portada').style.display = 'flex';
        }

        // Detector: Si la URL trae la orden #mapa desde el dashboard, abrimos el mapa directamente
        window.addEventListener('DOMContentLoaded', () => {
            if (window.location.hash === '#mapa') {
                abrirMapa();
            }
        });
    </script>
</body>
</html>
